components:
  schemas:
    OciCompartmentViewModel:
      type: object
      additionalProperties: false
      required:
      - description
      - timeCreated
      - tags
      - lifecycleState
      - compartmentId
      - name
      - id
      - dome9Id
      - accountNumber
      - region
      properties:
        description:
          type: string
        timeCreated:
          type: string
          format: date-time
        tags:
          type: object
          additionalProperties:
            type: string
        lifecycleState:
          type: string
        compartmentId:
          type: string
        name:
          type: string
        id:
          type: string
        dome9Id:
          type: string
        accountNumber:
          type: string
        region:
          type: string
  securitySchemes:
    basic:
      type: http
      scheme: basic
security:
- basic: []
x-readme:
  explorer-enabled: true
  proxy-enabled: true
