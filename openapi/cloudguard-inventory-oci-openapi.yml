info:
  title: Inventory - OCI
  version: v2
openapi: 3.0.0
servers:
- url: https://api.dome9.com/
  description: US region
- url: https://api.{region}.dome9.com/
  description: Other regions
  variables:
    region:
      enum:
      - eu1
      - ap1
      - ap2
      - ap3
      - cace1
      default: eu1
paths:
  /v2/OciCompartment:
    get:
      tags:
      - Oci Compartment
      operationId: OciCompartment_Get_get_/v2/OciCompartment
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OciCompartmentViewModel'
      description: ''
      summary: Get
  /v2/OciCompartment/{cloudAccountId}:
    get:
      tags:
      - Oci Compartment
      operationId: OciCompartment_GetAllCompartmentsByCloudAccountId_get_/v2/OciCompartment/{cloudAccountId}
      parameters:
      - name: cloudAccountId
        in: path
        required: true
        schema:
          type: string
          format: guid
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OciCompartmentViewModel'
      description: ''
      summary: Get All Compartments By Cloud Account Id
