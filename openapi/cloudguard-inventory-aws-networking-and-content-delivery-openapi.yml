  /v2/AwsCustomerGateway:
    get:
      tags:
      - Aws Customer Gateway
      operationId: AwsCustomerGateway_Get_get_/v2/AwsCustomerGateway
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudCustomerGateway.AwsCustomerGatewayViewModel'
      description: ''
      summary: Get
  /v2/AwsElasticIp:
    get:
      tags:
      - Aws Elastic Ip
      operationId: AwsElasticIp_Get_get_/v2/AwsElasticIp
