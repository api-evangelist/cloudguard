  /v2/cloudinstance/{externalid}/sec-groups:
    post:
      tags:
      - Cloud Instance
      summary: Attach Security Group To Instance
      operationId: CloudInstance_AttachSecurityGroupToInstance_post_/v2/cloudinstance/{externalid}/sec-groups
      parameters:
      - name: externalid
        in: path
        description: the external id of the instance
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudInstanceSecurityGroupAttachDetachViewModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudInstanceSecurityGroupAttachDetachViewModel'
        description: information to update
        required: true
      description: Attach security Group to an AWS EC2 Instance
    delete:
