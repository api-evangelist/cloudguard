components:
  schemas:
    Dome9.Web.Api.Agentless.AddAgentlessAwsAccountRequestBody:
      required:
      - crossAccountRoleName
      - crossAccountRoleExternalId
      type: object
      properties:
        crossAccountRoleName:
          description: The AWP cross account role name
          type: string
        crossAccountRoleExternalId:
          description: The AWP cross account role external id
          type: string
        cloudGuardAWPStackName:
          description: The AWP stack name
          type: string
        scanMode:
          description: Scan mode
          enum:
          - saas
          - inAccount
          type: string
        isTerraform:
          description: Indicates whether the account is onboarded with Terraform (Setting True will make AWP assume no cloud
            formation stack, hence no indication on CFT version updates)
          type: boolean
        agentlessAccountSettings:
          $ref: '#/components/schemas/Dome9.Web.Api.Agentless.AgentlessAccountSettingsViewModel'
          description: AWP account settings
    Dome9.Web.Api.Agentless.AgentlessAccountSettingsViewModel:
      type: object
      properties:
        disabledRegions:
          description: The list of regions that are disabled for the account
          type: array
          items:
            type: string
        skipFunctionAppsScan:
          description: Skip Azure Function Apps scan (supported for inAccount and inAccountSub scan modes)
          type: boolean
        inAccountScannerVPC:
          description: The VPC mode (supported for inAccount scan mode)
          enum:
          - ManagedByAWP
          - ManagedByCustomer
          type: string
        scanMachineIntervalInHours:
          format: int32
          description: The interval in hours to scan the account
          type: integer
        maxConcurrenceScansPerRegion:
          format: int32
          description: The max number of scans that can run concurrently per region
          type: integer
        customTags:
          description: A Dictionary of custom tags that will be added to each resource created by AWP
          type: object
          additionalProperties:
            type: string
        scanAWSLicensedImages:
          description: Scan AWS licensed images (supported for AWS inAccount mode)
          type: boolean
    Dome9.Web.Api.Agentless.AddAgentlessAzureAccountRequestBody:
      type: object
      properties:
        onboardingCustomizations:
          $ref: '#/components/schemas/Dome9.Web.Api.Agentless.AzureOnboardingCustomizationViewModel'
          description: AWP Azure Onboarding Customizations
        scanMode:
          description: Scan mode
          enum:
          - saas
          - inAccount
          type: string
        isTerraform:
          description: Indicates whether the account is onboarded with Terraform (Setting True will make AWP assume no cloud
            formation stack, hence no indication on CFT version updates)
          type: boolean
        agentlessAccountSettings:
          $ref: '#/components/schemas/Dome9.Web.Api.Agentless.AgentlessAccountSettingsViewModel'
          description: AWP account settings
    Dome9.Web.Api.Agentless.AzureOnboardingCustomizationViewModel:
      type: object
      properties:
        virtualMachineDataShareRoleName:
          type: string
        virtualMachineScanOperatorRoleName:
          type: string
        functionAppScanOperatorRoleName:
          type: string
        functionAppScannerRoleName:
          type: string
        resourceGroupName:
          type: string
        scannerManagedIdentityName:
          type: string
    Dome9.Web.Api.Agentless.AddAgentlessAwsCentralizedAccountRequestBody:
      required:
      - crossAccountRoleName
      - crossAccountRoleExternalId
      type: object
      properties:
        crossAccountRoleName:
          description: The AWP cross account role name
          type: string
        crossAccountRoleExternalId:
          description: The AWP cross account role external id
          type: string
        cloudGuardAWPStackName:
          description: The AWP stack name
          type: string
        isTerraform:
          description: Indicates whether the account is onboarded with Terraform (Setting True will make AWP assume no cloud
            formation stack, hence no indication on CFT version updates)
          type: boolean
        agentlessAccountSettings:
          $ref: '#/components/schemas/Dome9.Web.Api.Agentless.AgentlessCentralizedAccountSettingsViewModel'
