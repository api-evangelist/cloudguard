        in: path
        description: Cloud account Id (CloudGuard/external Id)
        required: true
        schema:
          type: string
      - name: shouldCreatePolicy
        in: query
        description: A flag indicating weather to create a default policy
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Agentless.AddAgentlessAwsAccountRequestBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Agentless.AddAgentlessAwsAccountRequestBody'
        required: true
      description: Enable AWP AWS account
