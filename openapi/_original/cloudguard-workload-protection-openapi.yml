          type: string
          format: guid
          nullable: true
        remediationId:
          type: string
          format: guid
          nullable: true
        error:
          type: string
          description: note that the lambda is not aware of this field
          default: ''
          nullable: true
        testObj:
          description: note that the lambda is not aware of this field
          nullable: true
