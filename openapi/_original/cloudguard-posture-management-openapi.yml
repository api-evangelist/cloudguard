          description: '[Optional] List of regions to exclude, for example ''us_east_1''.'
          type: array
          items:
            type: string
        rulesetId:
          format: int64
          description: Ruleset ID to apply exclusion on.
          type: integer
        cloudAccountIds:
          description: "[Optional] List of cloud account IDs to apply exclusion on.\r\nIf neither cloud account IDs nor organizational\
            \ unit IDs are supplied, exclusion will apply on all cloud accounts.\r\nIf both organizational unit IDs and cloud\
            \ account IDs are supplied, only organizational unit IDs will take effect."
          type: array
          items:
            format: uuid
            type: string
            example: 00000000-0000-0000-0000-000000000000
        organizationalUnitIds:
          description: "[Optional] List of organizational unit IDs to apply exclusion on.\r\nIf neither organizational unit\
            \ IDs nor cloud account IDs are supplied, exclusion will apply on all cloud accounts.\r\nIf both organizational\
            \ unit IDs and cloud account IDs are supplied, only organizational unit IDs will take effect."
          type: array
          items:
            format: uuid
            type: string
            example: 00000000-0000-0000-0000-000000000000
        comment:
          description: Comment text (free text)
          type: string
        dateRange:
          $ref: '#/components/schemas/Falconetix.Model.DateTimeRange'
          description: "[Optional] Effective date range for the exclusion.\r\nLeaving 'From' null will take only 'To' into\
            \ account.\r\nLeaving 'To' null will take only 'From' into account.\r\nDateRange with both 'From' and 'To' null\
