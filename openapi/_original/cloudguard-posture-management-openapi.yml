      summary: Get Last Assessment Results Mini To Executive Summary
      operationId: AssessmentHistoryV2_GetLastAssessmentResultsMiniToExecutiveSummary_get_/v2/AssessmentHistoryV2/ExecutiveReport/{vendor}/{rulesetId}
      parameters:
