      type: object
      properties:
        validationStatus:
          enum:
          - Relevant
          - Valid
          - Excluded
          type: string
        isRelevant:
          description: "means if entity is relevant for this rule\r\nfor example rule = \"Instance where name like '%db%'\
            \ should have...\", returns false in instance name = 'scheduler1'"
          type: boolean
        isValid:
          description: "means if entity is compliant.\r\nfor example for rule=\"Instance should have vpc\", return true if\
            \ instance i-123 is under vpc-234, and false if not"
          type: boolean
        isExcluded:
          description: "means if entity is excluded.\r\nfor example for rule=\"Instance should have vpc exclude name='test'\"\
            , return true if instance name is test, and false if not"
          type: boolean
        exclusionId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        remediationId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
