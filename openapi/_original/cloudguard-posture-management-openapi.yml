# x-archived-from: cloudguard-posture-management-openapi.yml
# x-archived-on: 2026-09-16
info:
  title: Posture Management
  version: v2
openapi: 3.0.0
servers:
- url: https://api.dome9.com/
  description: US region
- url: https://api.{region}.dome9.com/
  description: Other regions
  variables:
    region:
      enum:
      - eu1
      - ap1
      - ap2
      - ap3
      - cace1
      default: eu1
paths:
  /v2/assessment/bundleV2:
    post:
      tags:
      - Assessment
      summary: Run Bundle V2
      operationId: Assessment_RunBundleV2Async_post_/v2/assessment/bundleV2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Falconetix.Model.RuleEngine.ViewModels.Assessment.AssessmentResultViewModel_Newtonsoft.Json.Linq.JRaw_'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Falconetix.Model.RuleEngine.ViewModels.Assessment.AssessmentBundleRequestViewModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Falconetix.Model.RuleEngine.ViewModels.Assessment.AssessmentBundleRequestViewModel'
        description: The assessment request block
        required: true
      description: Run an assessment on a cloud environment using a bundle (V2)
  /v2/AssessmentHistoryV2/bundleResults:
    get:
      tags:
      - Assessment History V2
      summary: Get Bundle Results
      operationId: AssessmentHistoryV2_GetBundleResults_get_/v2/AssessmentHistoryV2/bundleResults
      parameters:
      - name: bundleId
        in: query
        description: the bundle used for the assessment (for all the accounts in the list)
        required: true
        schema:
          type: integer
          format: int64
      - name: cloudAccountIds
        in: query
        description: comma separated list of cloud accounts
        required: true
        schema:
          type: string
      - name: fromTime
        in: query
        description: the time the assessment was done
        required: true
        schema:
          type: string
          format: date-time
      - name: epsilonInMinutes
        in: query
        description: period of time (in min) back from the fromTime to look for results; only results in this range will be
          returned
        required: false
        schema:
          type: integer
          format: int64
      - name: requestId
        in: query
        description: an optional request id; the same value will appear in the response
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Falconetix.Model.RuleEngine.ViewModels.AssessmentHistory.V2.AssessmentHistoryResultV2ViewModel_Newtonsoft.Json.Linq.JRaw_'
      description: Get most recent assessment results for a specific bundle, for a list of cloud accounts
  /v2/AssessmentHistoryV2/assessmentTrendOrganizationalUnit:
    get:
      tags:
      - Assessment History V2
      summary: Get Assessment Trend Organizational Unit
      operationId: AssessmentHistoryV2_GetAssessmentTrendOrganizationalUnit_get_/v2/AssessmentHistoryV2/assessmentTrendOrganizationalUnit
      parameters:
      - name: rulesetId
        in: query
        description: Ruleset ID
        required: true
        schema:
          type: integer
          format: int64
      - name: organizationalUnitId
        in: query
        description: Organizational Unit ID
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        description: From Date
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: To Date
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Falconetix.Model.Compliance.AssessmentTrend.AssessmentTrendItemViewModel'
      description: Get the assessment trend for the selected time range (maximum of 93 days)
  /v2/AssessmentHistoryV2/assessmentTrendV2:
    get:
      tags:
      - Assessment History V2
      summary: Get Assessment Trend V2
      operationId: AssessmentHistoryV2_GetAssessmentTrendV2_get_/v2/AssessmentHistoryV2/assessmentTrendV2
      parameters:
      - name: bundleId
        in: query
        description: Bundle ID
        required: true
        schema:
          type: integer
          format: int64
      - name: cloudAccountId
        in: query
        description: Cloud Account ID
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        description: From Date
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: To Date
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
