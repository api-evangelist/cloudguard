      type: object
      additionalProperties: false
      required:
      - subscriptionId
      - storagesNames
      - returnJsonUrl
      properties:
        subscriptionId:
          type: string
          description: Azure Subscription ID of the Storage Accounts
        storagesNames:
          type: array
          description: List of storages to be onboarded to Intelligence Network Traffic
          items:
            type: string
        returnJsonUrl:
          type: boolean
          description: Indicates if to return json or full ARM template URL. Deault value is true, so the API will return
            a json URL.
          default: true
    AccountActivityArmApiRequest:
      type: object
      additionalProperties: false
      required:
      - subscriptionId
      - storagesDetails
      - returnJsonUrl
      properties:
        subscriptionId:
          type: string
          description: Azure Subscription ID of the Storage Accounts
        storagesDetails:
          type: array
          description: List of storages to be onboarded to Intelligence Account Activity
          items:
            $ref: '#/components/schemas/AccountActivityStorageDetails'
        returnJsonUrl:
          type: boolean
          description: Indicates whether to return json or full ARM template URL. The deault value is true, meaning the API
            will return a json URL.
          default: true
    AccountActivityStorageDetails:
      type: object
      additionalProperties: false
      required:
      - logTypes
      - storageName
      properties:
        logTypes:
          type: array
          description: '[Required] List of log types to be onboarded to Intelligence Account Activity'
          items:
            $ref: '#/components/schemas/CdrAzureActivityLogTypeEnum'
        storageName:
          type: string
          description: '[Required] Storage Account Name'
    CdrAzureActivityLogTypeEnum:
      type: string
      description: ''
      x-enumNames:
      - ActivityLogs
      - SignIns
      - AuditLogs
      - StorageAccounts
      enum:
      - ActivityLogs
      - SignIns
      - AuditLogs
      - StorageAccounts
