openapi: 3.2.0
info:
  title: Inventory Cloud S3 Bucket API
  version: v2
servers:
- url: https://api.dome9.com/
  description: US region
- url: https://api.{region}.dome9.com/
  description: Other regions
  variables:
    region:
      enum:
      - eu1
      - ap1
      - ap2
      - ap3
      - cace1
      default: eu1
security:
- basic: []
tags:
- name: Cloud S3 Bucket
paths:
  /v2/CloudS3Bucket:
    get:
      tags:
      - Cloud S3 Bucket
      operationId: CloudS3Bucket_Get_get_/v2/CloudS3Bucket
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudS3BucketViewModel'
      description: ''
      summary: Get
components:
  schemas:
    CloudS3LifecycleRuleNoncurrentVersionTransitionViewModel:
      type: object
      additionalProperties: false
      required:
      - noncurrentDays
      - storageClass
      properties:
        noncurrentDays:
          type: integer
          format: int32
        storageClass:
          type: string
    CloudS3TagViewModel:
      type: object
      additionalProperties: false
      required:
      - key
      - value
      properties:
        key:
          type: string
        value:
          type: string
    CloudS3ReplicationConfigurationViewModel:
      type: object
      additionalProperties: false
      required:
      - role
      - rules
      properties:
        role:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/CloudS3ReplicationRuleViewModel'
    CloudS3RoutingRuleViewModel:
      type: object
      additionalProperties: false
      required:
      - condition
      - redirect
      properties:
        condition:
          $ref: '#/components/schemas/CloudS3RoutingRuleConditionViewModel'
        redirect:
          $ref: '#/components/schemas/CloudS3RoutingRuleRedirectViewModel'
    CloudS3BucketVersioningViewModel:
      type: object
      additionalProperties: false
      required:
      - status
      - mfaDelete
      properties:
        status:
          type: string
        mfaDelete:
          type: boolean
    CloudS3RoutingRuleConditionViewModel:
      type: object
      additionalProperties: false
      required:
      - httpErrorCodeReturnedEquals
      - keyPrefixEquals
      properties:
        httpErrorCodeReturnedEquals:
          type: string
        keyPrefixEquals:
          type: string
    CloudS3BucketWebsiteViewModel:
      type: object
      additionalProperties: false
      required:
      - indexDocumentSuffix
      - errorDocument
      - routingRules
      - redirectAllRequestsTo
      properties:
        indexDocumentSuffix:
          type: string
        errorDocument:
          type: string
        routingRules:
          type: array
          items:
            $ref: '#/components/schemas/CloudS3RoutingRuleViewModel'
        redirectAllRequestsTo:
          $ref: '#/components/schemas/CloudS3RoutingRuleRedirectViewModel'
    CloudS3LifecycleRuleAbortIncompleteMultipartUploadViewModel:
      type: object
      additionalProperties: false
      required:
      - daysAfterInitiation
      properties:
        daysAfterInitiation:
          type: integer
          format: int32
    CloudS3LifecycleRuleNoncurrentVersionExpirationViewModel:
      type: object
      additionalProperties: false
      required:
      - noncurrentDays
      properties:
        noncurrentDays:
          type: integer
          format: int32
    CloudS3BucketPolicyViewModel:
      type: object
      additionalProperties: false
      required:
      - document
      properties:
        document:
          type: string
    CloudS3ReplicationRuleViewModel:
      type: object
      additionalProperties: false
      required:
      - id
      - prefix
      - status
      - destination
      properties:
        id:
          type: string
        prefix:
          type: string
        status:
          type: string
        destination:
          $ref: '#/components/schemas/CloudS3ReplicationDestinationViewModel'
    CloudS3LifecycleFilterPredicateViewModel:
      type: object
      additionalProperties: false
      required:
      - prefixOperand
      - tagOperands
      properties:
        prefixOperand:
          $ref: '#/components/schemas/CloudS3LifecyclePrefixPredicateViewModel'
        tagOperands:
          type: array
          items:
            $ref: '#/components/schemas/CloudS3LifecycleTagPredicateViewModel'
    CloudS3ServerSideEncryptionRuleViewModel:
      type: object
      additionalProperties: false
      required:
      - serverSideEncryptionByDefault
      properties:
        serverSideEncryptionByDefault:
          $ref: '#/components/schemas/CloudS3ServerSideEncryptionByDefaultViewModel'
    CloudS3LifecycleConfigurationViewModel:
      type: object
      additionalProperties: false
      required:
      - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/CloudS3LifecycleRuleViewModel'
    CloudS3LifecycleTransitionViewModel:
      type: object
      additionalProperties: false
      required:
      - date
      - dateUtc
      - days
      - storageClass
      properties:
        date:
          type: string
          format: date-time
        dateUtc:
          type: string
          format: date-time
        days:
          type: integer
          format: int32
        storageClass:
          type: string
    CloudS3ServerSideEncryptionConfigurationViewModel:
      type: object
      additionalProperties: false
      required:
      - serverSideEncryptionRules
      properties:
        serverSideEncryptionRules:
          type: array
          items:
            $ref: '#/components/schemas/CloudS3ServerSideEncryptionRuleViewModel'
    CloudS3BucketLoggingViewModel:
      type: object
      additionalProperties: false
      required:
      - targetPrefix
      - targetBucketName
      - grants
      properties:
        targetPrefix:
          type: string
        targetBucketName:
          type: string
        grants:
          type: array
          items:
            $ref: '#/components/schemas/CloudS3BucketGrantViewModel'
    CloudS3LifecyclePrefixPredicateViewModel:
      type: object
      additionalProperties: false
      required:
      - prefix
      properties:
        prefix:
          type: string
    CloudS3BucketAclViewModel:
      type: object
      additionalProperties: false
      required:
      - ownerId
      - ownerDisplayName
      - grants
      properties:
        ownerId:
          type: string
        ownerDisplayName:
          type: string
        grants:
          type: array
          items:
            $ref: '#/components/schemas/CloudS3BucketGrantViewModel'
    CloudS3LifecycleFilterViewModel:
      type: object
      additionalProperties: false
      required:
      - lifecycleFilterPredicate
      properties:
        lifecycleFilterPredicate:
          $ref: '#/components/schemas/CloudS3LifecycleFilterPredicateViewModel'
    CloudS3BucketViewModel:
      type: object
      additionalProperties: false
      required:
      - id
      - externalId
      - name
      - region
      - cloudAccountId
      - accountId
      - bucketName
      - creationTime
      - bucketLogging
      - bucketAcl
      - bucketPolicy
      - bucketVersioning
      - bucketWebsite
      - bucketEncryption
      - bucketReplication
      - bucketLifecycle
      - publicAccessBlock
      - s3RegionName
      - tags
      properties:
        id:
          type: string
        externalId:
          type: string
        name:
          type: string
        region:
          oneOf:
          - $ref: '#/components/schemas/CloudRegion'
        cloudAccountId:
          type: string
          format: guid
        accountId:
          type: integer
          format: int64
        bucketName:
          type: string
        creationTime:
          type: string
          format: date-time
        bucketLogging:
          $ref: '#/components/schemas/CloudS3BucketLoggingViewModel'
        bucketAcl:
          $ref: '#/components/schemas/CloudS3BucketAclViewModel'
        bucketPolicy:
          $ref: '#/components/schemas/CloudS3BucketPolicyViewModel'
        bucketVersioning:
          $ref: '#/components/schemas/CloudS3BucketVersioningViewModel'
        bucketWebsite:
          $ref: '#/components/schemas/CloudS3BucketWebsiteViewModel'
        bucketEncryption:
          $ref: '#/components/schemas/CloudS3ServerSideEncryptionConfigurationViewModel'
        bucketReplication:
          $ref: '#/components/schemas/CloudS3ReplicationConfigurationViewModel'
        bucketLifecycle:
          $ref: '#/components/schemas/CloudS3LifecycleConfigurationViewModel'
        publicAccessBlock:
          $ref: '#/components/schemas/CloudS3BucketPublicAccessBlockViewModel'
        s3RegionName:
          type: string
        tags:
          $ref: '#/components/schemas/TagsDictionary'
    TagsDictionary:
      type: object
      additionalProperties:
        type: string
    CloudS3LifecycleRuleExpirationViewModel:
      type: object
      additionalProperties: false
      required:
      - date
      - dateUtc
      - days
      - expiredObjectDeleteMarker
      properties:
        date:
          type: string
          format: date-time
        dateUtc:
          type: string
          format: date-time
        days:
          type: integer
          format: int32
        expiredObjectDeleteMarker:
          type: boolean
    CloudS3ServerSideEncryptionByDefaultViewModel:
      type: object
      additionalProperties: false
      required:
      - serverSideEncryptionAlgorithm
      - serverSideEncryptionKeyManagementServiceKeyId
      properties:
        serverSideEncryptionAlgorithm:
          type: string
        serverSideEncryptionKeyManagementServiceKeyId:
          type: string
    CloudS3BucketGrantViewModel:
      type: object
      additionalProperties: false
      required:
      - granteeType
      - granteeCanonicalUser
      - granteeDisplayName
      - granteeEmailAddress
      - granteeURI
      - granteePremissionHeaderName
      - granteePremission
      properties:
        granteeType:
          type: string
        granteeCanonicalUser:
          type: string
        granteeDisplayName:
          type: string
        granteeEmailAddress:
          type: string
        granteeURI:
          type: string
        granteePremissionHeaderName:
          type: string
        granteePremission:
          type: string
    CloudS3ReplicationDestinationViewModel:
      type: object
      additionalProperties: false
      required:
      - bucketArn
      - storageClass
      properties:
        bucketArn:
          type: string
        storageClass:
          type: string
    CloudS3LifecycleRuleViewModel:
      type: object
      additionalProperties: false
      required:
      - expiration
      - id
      - prefix
      - filter
      - status
      - transition
      - noncurrentVersionExpiration
      - noncurrentVersionTransition
      - transitions
      - noncurrentVersionTransitions
      - abortIncompleteMultipartUpload
      properties:
        expiration:
          $ref: '#/components/schemas/CloudS3LifecycleRuleExpirationViewModel'
        id:
          type: string
        prefix:
          type: string
        filter:
          $ref: '#/components/schemas/CloudS3LifecycleFilterViewModel'
        status:
          type: string
        transition:
          $ref: '#/components/schemas/CloudS3LifecycleTransitionViewModel'
        noncurrentVersionExpiration:
          $ref: '#/components/schemas/CloudS3LifecycleRuleNoncurrentVersionExpirationViewModel'
        noncurrentVersionTransition:
          $ref: '#/components/schemas/CloudS3LifecycleRuleNoncurrentVersionTransitionViewModel'
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/CloudS3LifecycleTransitionViewModel'
        noncurrentVersionTransitions:
          type: array
          items:
            $ref: '#/components/schemas/CloudS3LifecycleRuleNoncurrentVersionTransitionViewModel'
        abortIncompleteMultipartUpload:
          $ref: '#/components/schemas/CloudS3LifecycleRuleAbortIncompleteMultipartUploadViewModel'
    CloudS3LifecycleTagPredicateViewModel:
      type: object
      additionalProperties: false
      required:
      - tag
      properties:
        tag:
          $ref: '#/components/schemas/CloudS3TagViewModel'
