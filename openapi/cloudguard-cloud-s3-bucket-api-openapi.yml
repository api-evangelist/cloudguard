    CloudS3BucketPublicAccessBlockViewModel:
      type: object
      additionalProperties: false
      required:
      - blockPublicAcls
      - ignorePublicAcls
      - blockPublicPolicy
      - restrictPublicBuckets
      properties:
        blockPublicAcls:
          type:
          - boolean
          - 'null'
        ignorePublicAcls:
          type:
          - boolean
          - 'null'
        blockPublicPolicy:
          type:
          - boolean
          - 'null'
        restrictPublicBuckets:
          type:
          - boolean
          - 'null'
    CloudS3RoutingRuleRedirectViewModel:
      type: object
      additionalProperties: false
      required:
      - hostName
      - httpRedirectCode
      - protocol
      - replaceKeyPrefixWith
      - replaceKeyWith
      properties:
        hostName:
          type: string
        httpRedirectCode:
          type: string
        protocol:
          type: string
        replaceKeyPrefixWith:
          type: string
        replaceKeyWith:
          type: string
  securitySchemes:
    basic:
      type: http
      scheme: basic
