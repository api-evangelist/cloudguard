components:
  schemas:
    Dome9.Web.Api.AwsAppSync.AwsAppSyncViewModel:
      type: object
      properties:
        additionalAuthenticationProviders:
          type: array
          items:
            $ref: '#/components/schemas/CGN.Inventory.Aws.Model.WrapperModels.AppSyncAdditionalAuthenticationProvider'
