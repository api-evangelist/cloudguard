info:
  title: Inventory - AWS Application Integration
  version: v2
openapi: 3.0.0
servers:
- url: https://api.dome9.com/
  description: US region
- url: https://api.{region}.dome9.com/
  description: Other regions
  variables:
    region:
      enum:
      - eu1
      - ap1
      - ap2
      - ap3
      - cace1
      default: eu1
paths:
  /v2/AwsAppSync:
    get:
      tags:
      - Aws App Sync
      operationId: AwsAppSync_Get_get_/v2/AwsAppSync
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsAppSync.AwsAppSyncViewModel'
      description: ''
      summary: Get
  /v2/CloudSnsSubscription/{cloudAccountId}:
    get:
      tags:
      - Cloud Sns Subscription
      operationId: CloudSnsSubscription_GetByTopic_get_/v2/CloudSnsSubscription/{cloudAccountId}
      parameters:
      - name: cloudAccountId
        in: path
        required: true
        schema:
          type: string
      - name: topicArn
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudSnsSubscriptions.CloudSnsSubscriptionViewModel'
      description: ''
      summary: Get By Topic
  /v2/CloudSnsSubscription:
    get:
      tags:
      - Cloud Sns Subscription
      operationId: CloudSnsSubscription_Get_get_/v2/CloudSnsSubscription
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudSnsSubscriptions.CloudSnsSubscriptionViewModel'
      description: ''
      summary: Get
  /v2/CloudSnsTopic:
    get:
      tags:
      - Cloud Sns Topic
      operationId: CloudSnsTopic_Get_get_/v2/CloudSnsTopic
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudSnsTopics.CloudSnsTopicViewModel'
      description: ''
      summary: Get
