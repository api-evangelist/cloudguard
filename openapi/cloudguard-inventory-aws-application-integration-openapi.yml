          type: integer
    CGN.Inventory.Aws.Model.WrapperModels.AppSyncAuthorizationConfig:
      type: object
      properties:
        authorizationType:
          $ref: '#/components/schemas/CGN.Inventory.Aws.Model.WrapperModels.AppSyncConstantType'
        awsIamConfig:
          $ref: '#/components/schemas/CGN.Inventory.Aws.Model.WrapperModels.AppSyncAwsIamConfig'
    CGN.Inventory.Aws.Model.WrapperModels.AppSyncRdsHttpEndpointConfig:
      type: object
      properties:
        awsRegion:
          type: string
        awsSecretStoreArn:
          type: string
        databaseName:
          type: string
        dbClusterIdentifier:
          type: string
        schema:
          type: string
    CGN.Inventory.Aws.Model.WrapperModels.AppSyncAwsIamConfig:
      type: object
      properties:
        region:
          type: string
        signingServiceName:
          type: string
    Dome9.Web.Api.CloudSnsSubscriptions.CloudSnsSubscriptionViewModel:
      type: object
      properties:
        id:
          description: Id
          type: string
          readOnly: true
        externalId:
          description: ExternalId
          type: string
          readOnly: true
        name:
          description: Name
          type: string
          readOnly: true
        region:
          description: Region
          enum:
          - us_east_1
          - us_west_1
          - eu_west_1
          - ap_southeast_1
          - ap_northeast_1
          - us_west_2
          - sa_east_1
          - az_1_region_a_geo_1
          - az_2_region_a_geo_1
          - az_3_region_a_geo_1
          - ap_southeast_2
          - mellanox_region
          - us_gov_west_1
          - eu_central_1
