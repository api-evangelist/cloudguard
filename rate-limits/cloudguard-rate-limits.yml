description: CloudGuard publishes no API rate limits. The developer hub (856 reference pages plus the introduction
  and authentication pages) documents no request quota, no throttling window and no rate-limit response headers,
  and no RateLimit-*/X-RateLimit-*/Retry-After header is returned on a live unauthenticated call. This artifact
  records that honest zero; it replaces a 2026-05-04 scaffold that asserted invented limits (10 req/min free tier,
  X-RateLimit-* headers) the provider has never published.
