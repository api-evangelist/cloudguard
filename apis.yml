description: 'Check Point CloudGuard is a Cloud Native Application Protection Platform (CNAPP) delivering cloud security
  posture management (CSPM), cloud workload protection (CWPP), code security, cloud network security and cloud detection
  and response across AWS, Azure, GCP, Alibaba Cloud, Oracle Cloud, Kubernetes and on-premises environments. The public
  CloudGuard REST API - originally Dome9, still served from api.dome9.com and mirrored on the Infinity Portal regional hosts
  - is documented across 23 first-party OpenAPI definitions covering 823 operations: onboarding cloud accounts, running
  compliance assessments, managing rulesets and policies, triaging findings, routing notifications, protecting Kubernetes
  and serverless workloads, and reading a cross-cloud protected-asset inventory. Authentication is HTTP Basic with a V2
  API key id and secret created in the CloudGuard portal.'
apis:
- aid: cloudguard:cloudguard-waf-api
  name: CloudGuard WAF API
  description: >-
    CloudGuard WAF (formerly CloudGuard AppSec) protects web applications and APIs with contextual machine-learning
    threat prevention. Its management API is GraphQL, reached through the Check Point Infinity Portal
    gateway; Check Point publishes no GraphQL schema document or REST contract for it, but does ship an
    official MCP server that wraps it.
  humanURL: https://waf-doc.inext.checkpoint.com/
  tags:
  - API Security
  - WAF
  - Web Application Firewall
  - GraphQL
  properties:
  - type: Documentation
    url: https://waf-doc.inext.checkpoint.com/
  - type: MCPServer
    url: mcp/cloudguard-mcp.yml
  - type: ToolCrosswalk
    url: mcp/cloudguard-tool-crosswalk.yml
  - type: SourceCode
    url: https://github.com/CheckPointSW/mcp-servers/tree/main/packages/checkpoint-waf
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cloudguard.png
  baseURL: https://cloudinfra-gw.portal.checkpoint.com
  x-baseURL-note: >-
    Regional Infinity Portal gateway. The Check Point WAF API is GraphQL behind this host; the regional
    variants (cloudinfra-gw-us, cloudinfra-gw.ap, cloudinfra-gw.in, cloudinfra-gw.ae, cloudinfra-gw.ca)
    are documented in the official @chkp/checkpoint-waf-mcp README. No GraphQL schema document is published.
- aid: cloudguard:cloudguard-code-security-api
  name: CloudGuard Code Security (Spectral) API
  description: >-
    CloudGuard Code Security (formerly Spectral) provides developer-first secrets detection, infrastructure-as-code
    scanning and SCA. It is a CLI-driven toolchain wired into CI/CD rather than a REST API; the platform
    side is reached through the ShiftLeft account and policy operations of the CloudGuard Workload Protection
    API.
  humanURL: >-
    https://sc1.checkpoint.com/documents/CloudGuard_Dome9/Documentation/Code-Security-Spectral/Code-Security-Introduction.htm
  tags:
  - Code Security
  - Secrets Detection
  - SAST
  - IaC
  - CI/CD
  properties:
  - type: Documentation
    url: >-
      https://sc1.checkpoint.com/documents/CloudGuard_Dome9/Documentation/Code-Security-Spectral/Code-Security-Introduction.htm
  - type: CLI
    url: cli/cloudguard-cli.yml
  - type: GettingStarted
    url: >-
      https://sc1.checkpoint.com/documents/CloudGuard_Dome9/Documentation/Code-Security-Spectral/Get-Started-ShiftLeft.htm
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cloudguard.png
