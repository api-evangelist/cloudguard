strategic_direction:
  signal: product-succession
  summary: Check Point announced a strategic partnership with Wiz on 2025-02-11 that includes "the assisted migration
    of Check Point's CNAPP customers to Wiz". A follow-on announcement on 2025-09-29 brought the integrated Check
    Point cloud network security + Wiz CNAPP solution to general availability. CloudGuard Network Security, CloudGuard
    WAF and CloudGuard Code Security are named as continuing investment areas; the CNAPP/CSPM surface described
    by this API is the part being succeeded.
  quote: The mutually beneficial partnership includes joint integration and the assisted migration of Check Point's
    CNAPP customers to Wiz.
  evidence:
  - url: https://www.checkpoint.com/press-releases/check-point-software-technologies-and-wiz-enter-strategic-partnership-to-deliver-end-to-end-cloud-security/
    http_status: 202
    note: First-party press release. www.checkpoint.com answers our crawler with a 202 bot challenge and an empty
      body; the page is served to browsers.
  - url: https://www.globenewswire.com/news-release/2025/02/11/3024125/0/en/Check-Point-and-Wiz-Enter-Strategic-Partnership-to-Deliver-End-to-End-Cloud-Security.html
    http_status: 200
    note: The same Check Point release on the wire, readable; the quote above is taken from it.
  caveat: No deprecation, sunset or end-of-life date has been published for the CloudGuard v2 REST API itself. The
    API remains documented and live (401 on an unauthenticated call, not 410). This is recorded as direction, not
    as a retirement.
