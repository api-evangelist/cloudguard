domain_standards:
  market: cloud security posture management / CNAPP
  note: 'CloudGuard''s domain standards live in its compliance rulesets rather than in its wire protocol: the API
    exposes ruleset, bundle and assessment resources whose CONTENT implements published control frameworks, and
    the rulesets are addressable by id through the Posture Management API. CloudGuard does not implement a machine-readable
    security-content interchange standard (OSCAL, SCAP, SARIF, OCSF) on this API - findings are returned in a proprietary
    shape.'
  entries:
  - id: compliance-frameworks-as-rulesets
    conforms: true
    evidence: /v2/Compliance/Ruleset and /v2/AssessmentHistoryV2 in openapi/cloudguard-posture-management-openapi.yml
      expose CloudGuard-maintained rulesets that implement industry control frameworks (CIS Benchmarks, PCI DSS,
      HIPAA, GDPR, NIST 800-53, ISO 27001, SOC 2) as evaluable rules. Documented at https://sc1.checkpoint.com/documents/CloudGuard_Dome9/Documentation/Overview/CloudGuard-CSPM-Introduction.htm
    caveat: The frameworks are the subject matter of the rulesets, not a wire-format conformance of the API itself.
  - id: gsl-governance-specification-language
    conforms: true
    evidence: CloudGuard rules are authored in GSL, Check Point's published rule language, browsable at https://gsl.dome9.com/
      and evaluated through the Posture Management API. A first-party domain language, not an industry standard.
  - id: oscal
    conforms: false
    evidence: No OSCAL catalog/profile/assessment-results representation in any published schema.
  - id: sarif
    conforms: false
    evidence: No SARIF output declared on the Code Security or Image Assurance surfaces in the published definitions.
  - id: ocsf
    conforms: false
    evidence: Findings and alerts use proprietary Dome9.Web.Api.* view models; no OCSF class/category identifiers
      appear in the 1,430 published schemas.
  - id: cve
    conforms: true
    evidence: Image Assurance and vulnerability surfaces address findings by CVE identifier (openapi/cloudguard-workload-protection-openapi.yml,
      KubernetesImageAssurance_GetImageVulnerabilities). CVE is the identifier scheme this market shares.
