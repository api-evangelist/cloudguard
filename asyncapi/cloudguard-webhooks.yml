  - bundleDeleted
  - ruleAdded
  - ruleChanged
  - ruleDeleted
  targets:
  - email
- name: iam-safe-events (email)
  model: IamSafeEmailNotificationsDescriptor
  events:
  - leaseEvent
  - leaseNotificationsOthers
  - tamperDetected
  - enrollmentEvent
  - iamSafetyAccount
  - iamSafetyInvalidCredentials
