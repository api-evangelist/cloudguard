description: 'Check Point publishes no list price or public plan table for CloudGuard. Licensing is quote-based
  and module-scoped (posture/CSPM, workload/CWPP, WAF, code security), tied to the number of billable protected
  assets and linked to a Check Point User Center contract. This artifact records plan_count: 0 honestly; it replaces
  a 2026-05-04 scaffold that asserted invented Free/Pro/Enterprise tiers and prices the provider has never published.'
